<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- O iPhone transforma sozinho data, hora, telefone e endereco em link azul
     sublinhado, sem pedir licenca. No print do dono, "Amanha, 23/08 - das 8h
     as 12h" tinha virado link no meio do cartao. Nao e link, e o titulo do
     cartao - e tocar nele abria o calendario em vez de abrir o servico. -->
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<title>Limpah — protótipo</title>
<!-- O ícone da aba e o do iPhone (entrega 11; desenhados pelo
     app/gerar_icones.py, sem o nome). A maquete NÃO tem manifest nem o
     guarda da casca: ela não é um app para instalar, e o manifest aberto
     com dois cliques, direto do arquivo, daria erro no console. -->
<link rel="icon" href="icones/favicon.ico" sizes="16x16 32x32">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="stylesheet" href="css/limpah.css?v=7d71a2f0">
</head>
<body>

  <!-- Moldura de celular. No computador aparece como um telefone no centro da tela.
       No celular de verdade, ocupa a tela inteira (ver o @media do CSS). -->
  <div id="telefone">
    <div id="barra-status">
      <span>9:41</span>
      <span class="sinais">▮▮▮ ᯤ ▰</span>
    </div>
    <div id="palco"><!-- as telas são desenhadas aqui pelo app.js --></div>
  </div>

  <div id="aviso-prototipo">
    <strong>Protótipo fictício.</strong>
    Nada aqui cobra dinheiro, consulta antecedentes, usa GPS ou envia notificação de verdade.
    <a href="#" data-acao="reiniciarPrototipo">Reiniciar do zero</a>
  </div>

  <!-- A ordem importa: dados.js cria as regras e a lista de telas; os
       exemplos e a tomada da maquete vêm antes das telas; app.js liga tudo
       no fim. -->
  <script charset="utf-8" src="js/dados.js?v=7d71a2f0"></script>
  <script charset="utf-8" src="js/exemplos.js?v=7d71a2f0"></script>
  <script charset="utf-8" src="js/fonte-maquete.js?v=7d71a2f0"></script>
  <script charset="utf-8" src="js/telas-acesso.js?v=7d71a2f0"></script>
  <script charset="utf-8" src="js/telas-cliente.js?v=7d71a2f0"></script>
  <script charset="utf-8" src="js/telas-diarista.js?v=7d71a2f0"></script>
  <script charset="utf-8" src="js/app.js?v=7d71a2f0"></script>
</body>
</html>
